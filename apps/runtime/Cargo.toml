[package]
name = "apps-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "leafEX 参考运行时"
default-run = "runtime"

[[bin]]
name = "runtime"
path = "src/main.rs"

[[bin]]
name = "tool-bin"
path = "src/bin/tool_bin.rs"

[features]
default = [
    "ability-read-file",
    "ability-write-file",
    "ability-bash",
    "ability-todo-write",
    "ability-task",
    "port-cli",
    "port-http",
    "port-mcp",
    "port-fun",
    "port-grpc",
    "mgmt",
]
ability-read-file = ["frame-compose/ability-read-file"]
ability-write-file = ["frame-compose/ability-write-file"]
ability-bash = ["frame-compose/ability-bash"]
ability-todo-write = ["frame-compose/ability-todo-write"]
ability-task = ["frame-compose/ability-task"]
ability-kb = ["frame-compose/ability-kb"]
ability-dispatch = ["frame-compose/ability-dispatch"]
ability-skill = ["frame-compose/ability-skill"]
ability-prompt = ["frame-compose/ability-prompt"]
ability-session = ["frame-compose/ability-session"]
port-cli = ["dep:frame-port-cli"]
port-http = ["dep:frame-port-http"]
port-mcp = ["dep:frame-port-mcp"]
port-fun = ["dep:frame-port-fun"]
port-grpc = ["dep:frame-port-grpc"]
mgmt = ["frame-compose/mgmt", "dep:axum", "dep:tower-http"]

[dependencies]
clap = { workspace = true }
frame-compose = { workspace = true, features = [
    "ability-config",
    "ability-store",
    "ability-store-persist",
    "ability-store-temp",
    "ability-markdown",
    "ability-echo",
    "ability-shout",
    "ability-counter",
] }
frame-core = { workspace = true }
frame-port-cli = { workspace = true, optional = true }
frame-port-http = { workspace = true, optional = true }
frame-port-mcp = { workspace = true, optional = true }
frame-port-fun = { workspace = true, optional = true }
frame-port-grpc = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
