framework_version: "1"
id: kb
protocols: [http, fun]
depends:
  - store.persist
stateful: true
factory: true
config_schema:
  type: object
methods:
  - id: scope.kb_create
    description: 创建知识库
    input:
      type: object
  - id: scope.kb_open
    description: 打开知识库
    input:
      type: object
  - id: scope.kb_drop
    description: 销毁知识库
    input:
      type: object
  - id: scope.create
    description: 创建作用域
    input:
      type: object
  - id: scope.bind_source
    description: 绑定数据源
    input:
      type: object
  - id: scope.list
    description: 列举作用域
    input:
      type: object
  - id: clue.decompose
    description: 线索语义解构
    input:
      type: object
  - id: clue.gate
    description: 语义单元门控
    input:
      type: object
  - id: clue.build
    description: 构建 MIU 草案
    input:
      type: object
  - id: miu.get
    description: 按 id 取回 MIU
    input:
      type: object
  - id: miu.put
    description: 写入单条 MIU
    input:
      type: object
  - id: miu.put_many
    description: 批量写入草案
    input:
      type: object
  - id: miu.patch
    description: 增量补丁
    input:
      type: object
  - id: miu.mark_stale
    description: 标记过期
    input:
      type: object
  - id: miu.delete
    description: 删除 MIU
    input:
      type: object
  - id: miu.link_context
    description: 维护上下文链
    input:
      type: object
  - id: retrieve.by_id
    description: 精确取回
    input:
      type: object
  - id: retrieve.lexical
    description: 词法检索
    input:
      type: object
  - id: retrieve.symbol
    description: 符号检索
    input:
      type: object
  - id: retrieve.vector
    description: 向量检索
    input:
      type: object
  - id: retrieve.hybrid
    description: 词法+符号融合
    input:
      type: object
  - id: retrieve.expand_context
    description: 上下文扩展
    input:
      type: object
  - id: retrieve.related
    description: 相关检索
    input:
      type: object
  - id: retrieve.multi_source
    description: 多源检索
    input:
      type: object
  - id: stats.dim
    description: 维度聚合
    input:
      type: object
  - id: stats.dup_prob
    description: 重复概率
    input:
      type: object
  - id: stats.freshness
    description: 新鲜度
    input:
      type: object
  - id: stats.coverage
    description: 覆盖统计
    input:
      type: object
  - id: hook.subscribe
    description: 登记出站订阅
    input:
      type: object
  - id: hook.unsubscribe
    description: 移除订阅
    input:
      type: object
  - id: hook.list
    description: 列出订阅
    input:
      type: object
  - id: hook.deliveries
    description: 列出出站投递记录
    input:
      type: object
  - id: assess.verity
    description: 真实度评估
    input:
      type: object
outbound_topics:
  - name: kb.miu.ingested
    description: MIU 首次写入
    payload_schema:
      type: object
      properties:
        kb_id: { type: string }
        miu_id: { type: string }
        op: { type: string }
      required: [kb_id, miu_id, op]
  - name: kb.miu.updated
    description: MIU 更新
    payload_schema:
      type: object
      properties:
        kb_id: { type: string }
        miu_id: { type: string }
        op: { type: string }
      required: [kb_id, miu_id, op]
  - name: kb.miu.deleted
    description: MIU 删除
    payload_schema:
      type: object
      properties:
        kb_id: { type: string }
        miu_id: { type: string }
        op: { type: string }
      required: [kb_id, miu_id, op]
