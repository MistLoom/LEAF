framework_version: "1"
id: write_file
leaf_builtin: true
open: true
protocols: [tools, mcp, cli, http, fun]
depends: []
stateful: false
methods:
  - id: run
    description: Write contents to a file.
    input:
      type: object
      description: Provide contents or bytes_base64. If both are provided, bytes_base64 takes precedence.
      properties:
        path:
          type: string
        contents:
          type: string
          description: UTF-8 text to write. Required unless bytes_base64 is provided.
        bytes_base64:
          type: string
          description: Standard Base64-encoded bytes to write. Takes precedence over contents when both are provided.
        overwrite:
          type: boolean
          default: true
          description: Whether to overwrite an existing file. Defaults to true.
      required: [path]
      anyOf:
        - required: [contents]
        - required: [bytes_base64]
